<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 520" role="img" aria-label="مقبض أضواء السيارة والغمازات">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#172831"/><stop offset=".48" stop-color="#08131a"/><stop offset="1" stop-color="#02070b"/>
    </linearGradient>
    <linearGradient id="body" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#88979d"/><stop offset=".2" stop-color="#4a5a61"/><stop offset=".52" stop-color="#222e35"/><stop offset="1" stop-color="#070f14"/>
    </linearGradient>
    <linearGradient id="ring" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#eef4f5"/><stop offset=".2" stop-color="#a9b3b7"/><stop offset=".5" stop-color="#506067"/><stop offset=".78" stop-color="#1d282e"/><stop offset="1" stop-color="#091116"/>
    </linearGradient>
    <filter id="shadow" x="-30%" y="-60%" width="180%" height="220%">
      <feDropShadow dx="0" dy="24" stdDeviation="17" flood-color="#000" flood-opacity=".56"/>
    </filter>
    <filter id="glow">
      <feGaussianBlur stdDeviation="8" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

