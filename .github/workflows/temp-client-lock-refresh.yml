name: Temporary Client Lock Refresh

on:
  push:
    branches:
      - fix/ai-image-prompt-routing

permissions:
  contents: write

jobs:
  refresh-lock:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Regenerate client lockfile
        working-directory: client
        run: npm install --package-lock-only --ignore-scripts --no-audit

      - name: Commit refreshed lockfile
        run: |
          if git diff --quiet -- client/package-lock.json; then
            echo "Lockfile is already in sync."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add client/package-lock.json
          git commit -m "ci: sync client lockfile after Tailwind v4 migration"
          git push origin HEAD:${GITHUB_REF_NAME}
