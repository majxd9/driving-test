name: API Health Monitor

on:
  workflow_dispatch:
  push:
    branches: [main]
  schedule:
    - cron: "*/15 * * * *"

permissions:
  contents: read

jobs:
  health:
    runs-on: ubuntu-24.04

    steps:
      - name: Verify healthcheck secret
        env:
          HEALTHCHECK_URL: ${{ secrets.HEALTHCHECK_URL }}
        run: |
          test -n "$HEALTHCHECK_URL" || {
            echo "HEALTHCHECK_URL secret is required"
            exit 1
          }

      - name: Check API health
        env:
          HEALTHCHECK_URL: ${{ secrets.HEALTHCHECK_URL }}
        run: |
          echo "Checking API health..."

          HEALTH_ENDPOINT="$HEALTHCHECK_URL"
          case "$HEALTH_ENDPOINT" in
            */api/healthz) ;;
            */) HEALTH_ENDPOINT="${HEALTH_ENDPOINT}api/healthz" ;;
            *) HEALTH_ENDPOINT="${HEALTH_ENDPOINT}/api/healthz" ;;
          esac

          for attempt in 1 2 3; do
            echo "Attempt $attempt/3..."

            MAX_TIME=60
            if [ "$attempt" -gt 1 ]; then
              MAX_TIME=30
            fi

            if curl \
              --fail \
              --show-error \
              --silent \
              --connect-timeout 10 \
              --max-time "$MAX_TIME" \
              "$HEALTH_ENDPOINT"; then

              echo
              echo "API health check passed."
              exit 0
            fi

            if [ "$attempt" -lt 3 ]; then
              echo "API did not respond successfully. Retrying in 10 seconds..."
              sleep 10
            fi
          done

          echo "API health check failed after 3 attempts."
          exit 1

      - name: Check Cloudflare Pages production assets
        env:
          FRONTEND_URL: https://driving-test-7en.pages.dev
        shell: bash
        run: |
          set -euo pipefail
          temp_dir="$(mktemp -d)"
          trap 'rm -rf "$temp_dir"' EXIT

          fetch_with_retry() {
            local url="$1"
            local destination="$2"
            local attempt
            for attempt in 1 2 3 4 5 6; do
              if curl --fail --location --silent --show-error \
                --connect-timeout 10 --max-time 30 \
                "$url" --output "$destination"; then
                return 0
              fi
              if [ "$attempt" -lt 6 ]; then
                echo "Production asset request failed (attempt $attempt/6); retrying in 10 seconds."
                sleep 10
              fi
            done
            echo "Production asset request failed after 6 attempts: $url" >&2
            return 1
          }

          fetch_with_retry "$FRONTEND_URL/" "$temp_dir/home.html"
          grep -Eiq '<!doctype html|<html' "$temp_dir/home.html"
          echo "Cloudflare home page returned valid HTML."

          fetch_with_retry "$FRONTEND_URL/car-explorer/index.html?healthcheck=1" "$temp_dir/car-explorer.html"
          grep -Fq 'id="carSelect"' "$temp_dir/car-explorer.html" || {
            echo "Production car viewer HTML is missing its vehicle selector. Response title:"
            grep -Eio '<title>[^<]+' "$temp_dir/car-explorer.html" | head -n 1 || true
            exit 1
          }
          grep -Fq 'id="guideRobotCanvas"' "$temp_dir/car-explorer.html" || {
            echo "Production car viewer HTML is missing the Deli robot canvas."
            exit 1
          }

          viewer_script="$(grep -o 'src="[^"]*viewer.js?v=[^"]*"' "$temp_dir/car-explorer.html" | grep -m 1 'viewer.js' | cut -d '"' -f 2)"
          guide_robot_script="$(grep -o 'src="[^"]*guide-robot.js?v=[^"]*"' "$temp_dir/car-explorer.html" | grep -m 1 'guide-robot.js' | cut -d '"' -f 2)"
          test -n "$viewer_script" || { echo "Could not find the viewer.js script URL in production HTML."; exit 1; }
          test -n "$guide_robot_script" || { echo "Could not find the guide-robot.js script URL in production HTML."; exit 1; }

          fetch_with_retry "$FRONTEND_URL/car-explorer/${viewer_script#./}" "$temp_dir/viewer.js"
          grep -Fq 'function animateMeshPositions(paths' "$temp_dir/viewer.js"
          grep -Fq 'setLoadError(message, "تعذّر تحميل " + spec.label)' "$temp_dir/viewer.js"

          fetch_with_retry "$FRONTEND_URL/car-explorer/${guide_robot_script#./}" "$temp_dir/guide-robot.js"
          grep -Fq 'Zeb.usdz' "$temp_dir/guide-robot.js"
          grep -Fq 'readPointer' "$temp_dir/guide-robot.js"

          fetch_with_retry "$FRONTEND_URL/car-explorer/Zeb.usdz" "$temp_dir/Zeb.usdz"
          test "$(wc -c < "$temp_dir/Zeb.usdz")" -ge 1000
          echo "Cloudflare production smoke passed: home, standalone car viewer, versioned viewer JS, Deli guide JS, and Zeb.usdz returned successfully."
