name: API Health Monitor

on:
  workflow_dispatch:
  schedule:
    - cron: "*/15 * * * *"

jobs:
  health:
    runs-on: ubuntu-24.04

    steps:
      - name: Verify healthcheck secret
        env:
          HEALTHCHECK_URL: ${{ secrets.HEALTHCHECK_URL }}
        run: |
          test -n "$HEALTHCHECK_URL" || {
            echo "HEALTHCHECK_URL secret is required"
            exit 1
          }

      - name: Check API health
        env:
          HEALTHCHECK_URL: ${{ secrets.HEALTHCHECK_URL }}
        run: |
          echo "Checking API health..."

          for attempt in 1 2 3; do
            echo "Attempt $attempt/3..."

            if curl \
              --fail \
              --show-error \
              --silent \
              --connect-timeout 10 \
              --max-time 30 \
              "$HEALTHCHECK_URL"; then

              echo
              echo "API health check passed."
              exit 0
            fi

            if [ "$attempt" -lt 3 ]; then
              echo "API did not respond successfully. Retrying in 10 seconds..."
              sleep 10
            fi
          done

          echo "API health check failed after 3 attempts."
          exit 1
