name: API Health Monitor

on:
  workflow_dispatch:
  schedule:
    - cron: "*/15 * * * *"

jobs:
  health:
    runs-on: ubuntu-latest
    steps:
      - name: Verify healthcheck secret
        env:
          HEALTHCHECK_URL: ${{ secrets.HEALTHCHECK_URL }}
        run: |
          test -n "$HEALTHCHECK_URL" || { echo "HEALTHCHECK_URL secret is required"; exit 1; }

      - name: Check API health
        env:
          HEALTHCHECK_URL: ${{ secrets.HEALTHCHECK_URL }}
        run: |
          for attempt in 1 2 3; do
            echo "Health check attempt $attempt/3"
            if curl --fail-with-body --show-error --silent --max-time 20 "$HEALTHCHECK_URL"; then
              echo
              echo "Health check passed."
              exit 0
            fi
            if [ "$attempt" -lt 3 ]; then
              sleep 5
            fi
          done
          echo "Health check failed after 3 attempts."
          exit 1
