name: release-check

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  client:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20.19.x
          cache: npm
          cache-dependency-path: client/package-lock.json
      - run: npm install --package-lock-only --ignore-scripts --no-audit
      - name: Refresh lockfile in repository
        run: |
          if [ "${{ github.event_name }}" != "push" ]; then
            exit 0
          fi
          if git diff --quiet -- package-lock.json; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "ci: refresh client lockfile"
          git push origin HEAD:main
      - run: npm ci
      - run: npm run build
      # Build tooling (Tailwind 3/chokidar) is a dev-only dependency tree.
      # The deployed client does not ship node_modules, so audit runtime dependencies
      # separately without blocking the release on a dev-only advisory.
      - run: npm audit --omit=dev --audit-level=moderate

  server:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - run: dotnet restore
      - run: dotnet build --configuration Release --no-restore
      - run: dotnet list package --vulnerable --include-transitive
