name: release-check

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  client:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20.19.x
          cache: npm
          cache-dependency-path: client/package-lock.json
      - run: npm ci
      - run: npm run audit:questions
      - run: npm run build
      - name: Runtime dependency audit
        run: npm audit --omit=dev --audit-level=moderate
      - name: Full dependency audit report
        run: npm audit --include=dev --json > npm-audit-full.json || true
      - name: Upload npm dependency audit report
        uses: actions/upload-artifact@v4
        with:
          name: npm-dependency-audit
          path: client/npm-audit-full.json
          if-no-files-found: error
          retention-days: 14

  server:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - run: dotnet restore
      - run: dotnet build --configuration Release --no-restore
      - name: NuGet vulnerability scan
        shell: bash
        run: |
          set -o pipefail
          dotnet list package --vulnerable --include-transitive | tee nuget-vulnerabilities.txt
          if grep -Fq "has the following vulnerable packages" nuget-vulnerabilities.txt; then
            echo "Vulnerable NuGet packages detected."
            exit 1
          fi
      - name: Upload NuGet vulnerability report
        uses: actions/upload-artifact@v4
        with:
          name: nuget-vulnerability-report
          path: server/nuget-vulnerabilities.txt
          if-no-files-found: error
          retention-days: 14
